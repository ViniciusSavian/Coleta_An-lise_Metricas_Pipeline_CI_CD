name: Coleta Automática de Métricas

on:
  # Dispara sempre que o CI Pipeline terminar (sucesso ou falha)
  workflow_run:
    workflows: ["CI Pipeline - Calculadora"]
    types: [completed]

jobs:
  collect-metrics:
    name: "Coletar e persistir métricas"
    runs-on: ubuntu-latest

    permissions:
      contents: write   # necessário para git push
      actions: read     # necessário para ler runs e artefatos via API

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          # Usa token com permissão de escrita para poder fazer push
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências de coleta e visualização
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas matplotlib

      - name: Coletar métricas via API do GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/collect_metrics.py

      - name: Gerar gráficos atualizados
        run: |
          mkdir -p Entregaveis/graficos
          python scripts/generate_graphs.py

      - name: Verificar se há mudanças nas métricas
        id: check_changes
        run: |
          git diff --quiet Entregaveis/metrics.csv Entregaveis/metrics.json \
            Entregaveis/graficos/ || echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: Commit e push das métricas atualizadas
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Entregaveis/metrics.csv \
                  Entregaveis/metrics.json \
                  Entregaveis/graficos/
          git commit -m "ci: atualiza métricas automaticamente após run #${{ github.event.workflow_run.run_number }} [skip ci]"
          git push

      - name: Sem mudanças — nada a commitar
        if: steps.check_changes.outputs.has_changes != 'true'
        run: echo "Métricas já estão atualizadas. Nenhum commit necessário."
